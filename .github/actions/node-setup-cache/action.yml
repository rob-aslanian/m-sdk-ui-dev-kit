name: 'Node.js Setup with Cache'
description: 'Sets up Node.js with dependency caching for the initial setup job'
author: 'miningos-devops'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20.x'
  package-manager:
    description: 'auto (detect), pnpm, or npm'
    required: false
    default: 'auto'
  pnpm-version:
    description: 'pnpm major.minor.patch when package-manager is pnpm (ignored for npm)'
    required: false
    default: ''
  install-dependencies:
    description: 'Whether to install dependencies on cache miss'
    required: false
    default: 'true'
  additional-packages:
    description: 'Additional system packages to install (space-separated)'
    required: false
    default: ''

outputs:
  cache-key:
    description: 'The generated cache key for node_modules'
    value: ${{ steps.cache-keys.outputs.cache-key }}
  cache-hit:
    description: 'Whether the cache was hit'
    value: ${{ steps.cache-node-modules.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Generate cache keys
      id: cache-keys
      shell: bash
      run: |
        NODE_VERSION="${{ inputs.node-version }}"
        BASE_KEY="node-modules-${{ runner.os }}-${NODE_VERSION}"
        HASH_KEY="${BASE_KEY}-${{ hashFiles('package-lock.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}"
        echo "cache-key=${HASH_KEY}" >> $GITHUB_OUTPUT
        echo "base-key=${BASE_KEY}" >> $GITHUB_OUTPUT

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve package manager
      id: pm
      shell: bash
      env:
        PM_INPUT: ${{ inputs.package-manager }}
        VER_INPUT: ${{ inputs.pnpm-version }}
      run: |
        if [ "$PM_INPUT" = "auto" ]; then
          if [ -f pnpm-lock.yaml ] || grep -q '"packageManager"[[:space:]]*:[[:space:]]*"pnpm@' package.json 2>/dev/null; then
            echo "package_manager=pnpm" >> "$GITHUB_OUTPUT"
            ver=$(grep -m1 '"packageManager"' package.json 2>/dev/null | sed -n 's/.*pnpm@\([0-9.]*\).*/\1/p' || true)
            echo "pnpm_version=${ver:-10}" >> "$GITHUB_OUTPUT"
          else
            echo "package_manager=npm" >> "$GITHUB_OUTPUT"
            echo "pnpm_version=" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "package_manager=${PM_INPUT}" >> "$GITHUB_OUTPUT"
          if [ "$PM_INPUT" = "pnpm" ]; then
            echo "pnpm_version=${VER_INPUT:-10}" >> "$GITHUB_OUTPUT"
          else
            echo "pnpm_version=" >> "$GITHUB_OUTPUT"
          fi
        fi

    - name: Setup pnpm
      if: inputs.install-dependencies == 'true' && steps.pm.outputs.package_manager == 'pnpm'
      uses: pnpm/action-setup@v4

    - name: Install additional system packages
      if: inputs.additional-packages != ''
      shell: bash
      run: |
        echo "Installing additional packages: ${{ inputs.additional-packages }}"
        sudo apt update
        sudo apt install -y ${{ inputs.additional-packages }}

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PKG_MGR: ${{ steps.pm.outputs.package_manager }}
      run: |
        if [ "$PKG_MGR" = "pnpm" ]; then
          echo "Using pnpm install --frozen-lockfile"
          pnpm install --frozen-lockfile
        elif [ -f package-lock.json ]; then
          echo "Found package-lock.json, using npm ci for deterministic installs"
          npm ci
        else
          echo "No package-lock.json found, using npm install"
          npm install
        fi

    - name: Cache node modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ steps.cache-keys.outputs.cache-key }}
        restore-keys: |
          ${{ steps.cache-keys.outputs.base-key }}-
